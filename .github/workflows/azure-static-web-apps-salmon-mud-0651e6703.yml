name: Deploy AI Ecosystem Atlas to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ai-ecosystem-atlas-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Validate, build, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate canonical data
        run: npm run validate:data

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Verify static export
        run: npm run verify:static

      - name: Request GitHub OIDC token
        id: idtoken
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: return await core.getIDToken()
          result-encoding: string

      - name: Deploy prebuilt artifact to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_MUD_0651E6703 }}
          action: upload
          app_location: out
          github_id_token: ${{ steps.idtoken.outputs.result }}
          output_location: ""
          skip_app_build: true
